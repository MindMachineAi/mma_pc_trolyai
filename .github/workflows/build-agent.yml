name: Build agent (Windows exe)

on:
  push:
    tags: ["agent-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r apps/agent/requirements.txt
          pip install pyinstaller

      - name: Build one-file exe
        working-directory: apps/agent
        run: pyinstaller --clean --noconfirm build.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-windows-x64
          path: apps/agent/dist/agent.exe
          retention-days: 30

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/agent/dist/agent.exe
          generate_release_notes: true
