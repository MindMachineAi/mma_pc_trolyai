name: Build agent (Windows exe)

on:
  push:
    tags: ["agent-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r apps/agent/requirements.txt
          pip install pyinstaller

      - name: Build one-file exe
        working-directory: apps/agent
        run: pyinstaller --clean --noconfirm build.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-windows-x64
          path: apps/agent/dist/agent.exe
          retention-days: 30

      - name: Build SHA256SUMS.txt
        shell: pwsh
        run: |
          $files = @(
            @{ Path = 'apps/agent/dist/agent.exe'; Name = 'agent.exe' },
            @{ Path = 'apps/agent/install.ps1'; Name = 'install.ps1' },
            @{ Path = 'apps/agent/uninstall.ps1'; Name = 'uninstall.ps1' }
          )
          $lines = foreach ($item in $files) {
            if (-not (Test-Path -LiteralPath $item.Path)) { throw "Khong thay $($item.Path)" }
            $hash = (Get-FileHash -LiteralPath $item.Path -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($item.Name)"
          }
          $content = ($lines -join "`r`n") + "`r`n"
          [IO.File]::WriteAllText("$PWD/SHA256SUMS.txt", $content, [Text.UTF8Encoding]::new($false))
          Get-Content -LiteralPath "$PWD/SHA256SUMS.txt" | Write-Host

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/agent/dist/agent.exe
            apps/agent/install.ps1
            apps/agent/uninstall.ps1
            SHA256SUMS.txt
          generate_release_notes: true
